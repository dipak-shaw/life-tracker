body.light{--bg:#f5f4f0;--sf:#ffffff;--sf2:#f0eeea;--bd:#e0ddd8;--bd2:#c8c4be;--tx:#1a1a1a;--tx2:#6a6660;--tx3:#aaa8a4;--gd:#d4f7e4;--rdd:#fde8e8;--amd:#fff8e0;--bld:#e8f0ff}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}

input,textarea,select{font-family:inherit;color:var(--tx);background:none;border:none;outline:none}

input[type=checkbox]{width:15px;height:15px;accent-color:var(--gr);cursor:pointer;flex-shrink:0}

.tb{display:flex;align-items:center;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.pt{font-size:26px;font-weight:800;flex:1;letter-spacing:-.02em}
.sp{display:inline-flex;align-items:center;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600}

.cbr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cbn{font-size:11px;color:var(--tx2);width:70px}.cbt{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}

.ctc{font-size:9px;margin-top:1px}.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}.dot{width:5px;height:5px;border-radius:50%}

.gb{font-size:10px;background:var(--sf2);border:1px solid var(--bd2);border-radius:6px;padding:3px 8px;color:var(--tx2)}.gb:hover{color:var(--tx)}
.tr{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--bd)}.tr:last-of-type{border:none}
.tt{flex:1;font-size:12px}.tt.done{text-decoration:line-through;color:var(--tx3)}

.rec{font-size:9px;background:#1a1a3a;color:var(--bl);border-radius:3px;padding:1px 5px}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.td{font-size:12px;color:var(--tx3)}.td:hover{color:var(--rd)}
.nt2{font-size:12px;color:var(--tx3);font-style:italic;padding:4px 0 8px}
.ar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.as,.ai,.at{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--tx);font-family:inherit}
.as:focus,.ai:focus,.at:focus{border-color:var(--bd2)}
.ai{flex:1;min-width:80px}.ai::placeholder{color:var(--tx3)}.at{width:90px}
.ab{background:var(--gd);color:var(--gr);border:1px solid var(--gd);border-radius:7px;padding:5px 12px;font-size:11px;font-weight:600}.ab:hover{background:var(--gr);color:#0f0f0f}
.xb{background:var(--amd);color:var(--am);border:1px solid var(--amd);border-radius:7px;padding:5px 9px;font-size:10px;font-weight:500}.xb:hover{background:var(--am);color:#0f0f0f}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.auth-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:11px;flex-wrap:wrap}

.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-ok{background:var(--gr)}.sync-err{background:var(--rd)}.sync-spin{background:var(--am);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.gbtn{font-size:11px;border:1px solid var(--bd2);border-radius:6px;padding:4px 10px;background:var(--sf2);color:var(--tx);cursor:pointer}
.gbtn:hover{border-color:var(--tx2)}
</style>

<body>
<div id="toolbar" style="position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap">
  <span style="font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--tx)">Life Tracker</span>
  <div style="flex:1"></div>
  <!-- Drive status -->
  <div id="auth-bar" style="display:flex;align-items:center;gap:6px">
    <span style="color:var(--tx3);font-size:11px">Connecting…</span>
  </div>

  <!-- Tools -->
  <button class="gbtn" onclick="exportData()" title="Export backup">⬇️</button>

<footer style="max-width:960px;margin:24px auto 32px;padding:16px;text-align:center;font-size:11px;color:var(--tx3);border-top:1px solid var(--bd)">

<script>
// ══ GOOGLE DRIVE SYNC — CONFIGURATION ════════════════════════════════════════════════════
// To enable Google Drive sync across devices you need a free OAuth 2.0 Client ID.
// Full step-by-step setup is in README.md. TL;DR:
//   1. https://console.cloud.google.com/  → create a project
//   2. APIs & Services → Library → enable "Google Drive API"
//   3. OAuth consent screen → External → add yourself as a Test User
//   4. Credentials → Create OAuth Client ID → Web application
//      Authorized JavaScript origins:
//        http://localhost:8080
//        https://YOUR-USERNAME.github.io
//   5. Paste the generated Client ID below (or override at runtime — see below).
//
// Three ways to provide the Client ID, checked in this order:
//   (a) URL query param   —  ?client_id=XXX.apps.googleusercontent.com
//   (b) localStorage      —  localStorage.setItem('lft_client_id','XXX...')
//   (c) the constant below
// This lets one published file work for many users without editing code.
// ════════════════════════════════════════════════════════════════════════════════════════
const DEFAULT_CLIENT_ID='853038975975-1akjuk1dl0djt4keualqbjgr7ohe0fad.apps.googleusercontent.com';
const PLACEHOLDER='YOUR_GOOGLE_CLIENT_ID';

function resolveClientId(){
  try{
    const p=new URLSearchParams(location.search).get('client_id');
    if(p&&p.trim())return p.trim();
  }catch(e){}
  const ls=localStorage.getItem('lft_client_id');
  if(ls&&ls.trim())return ls.trim();
  return DEFAULT_CLIENT_ID;
}
let CLIENT_ID=resolveClientId();
const SCOPES='https://www.googleapis.com/auth/drive.appdata';
const FNAME='life-tracker-data.json';
let _token=null,_fileId=null,_timer=null,_user='';

function isCfg(){return CLIENT_ID&&CLIENT_ID!==PLACEHOLDER;}

function setClientId(id){
  if(!id||!id.trim()){localStorage.removeItem('lft_client_id');CLIENT_ID=DEFAULT_CLIENT_ID;}
  else{localStorage.setItem('lft_client_id',id.trim());CLIENT_ID=id.trim();}
  setToken(null);_fileId=null;_user='';localStorage.removeItem('lft_user');
  hideSetupPanel();renderAuthBar();
}

// ── Token helpers ──
function getToken(){return _token||localStorage.getItem('lft_token');}
function setToken(t){_token=t;if(t)localStorage.setItem('lft_token',t);else localStorage.removeItem('lft_token');}

// ── Status bar ──
function setSyncStatus(s,msg){
  const dot=document.getElementById('sd');
  const lbl=document.getElementById('sl2');
  const cls={'ok':'sync-ok','err':'sync-err','spin':'sync-spin','offline':'sync-err'}[s]||'sync-err';
  if(dot){dot.className='sync-dot '+cls;}
  if(lbl)lbl.textContent=msg||s;
}

// ── Drive REST helper (plain fetch, no gapi needed) ──
async function dfetch(url,opts){
  const tk=getToken();if(!tk)return null;
  const h={'Authorization':'Bearer '+tk,...(opts.headers||{})};
  const r=await fetch(url,{...opts,headers:h});
  if(r.status===401){handleExpired();return null;}
  return r;
}

function handleExpired(){
  setToken(null);setSyncStatus('err','Session expired - reconnect');renderAuthBar();
}

async function findFile(){
  const r=await dfetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27'+FNAME+'%27&fields=files(id)',{method:'GET'});
  if(!r)return null;
  const d=await r.json();
  return d.files&&d.files.length?d.files[0].id:null;
}

async function createFile(){
  const r=await dfetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:FNAME,parents:['appDataFolder']})
  });
  if(!r)return null;
  const d=await r.json();return d.id;
}

async function ensureFileId(){
  if(_fileId)return _fileId;
  _fileId=await findFile();
  if(!_fileId)_fileId=await createFile();
  return _fileId;
}

async function saveToDrive(){
  if(!isCfg()||!getToken())return;
  setSyncStatus('spin','Saving…');
  try{
    const fid=await ensureFileId();if(!fid){setSyncStatus('err','Drive error');return;}
    const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)
    });
    if(r&&r.ok)setSyncStatus('ok','Saved '+new Date().toLocaleTimeString());
    else setSyncStatus('err','Save failed');
  }catch(e){setSyncStatus('err','Save error');console.error(e);}
}

async function loadFromDrive(){
  if(!isCfg()||!getToken()){setSyncStatus('offline','Not connected');return;}
  setSyncStatus('spin','Loading…');
  try{
    const fid=await ensureFileId();if(!fid){setSyncStatus('err','File error');return;}
    const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media',{method:'GET'});
    if(!r){return;}
    if(r.ok){
      const txt=await r.text();
      const hasLocal=Object.keys(DATA.tasks||{}).length>0||Object.keys(DATA.goals||{}).length>0||(DATA.recurring||[]).length>0;
      if(txt.trim()){
        const d=JSON.parse(txt);
        DATA={goals:{},tasks:{},recurring:[],recurDone:{},...d};
        save(false);
        setSyncStatus('ok','Synced '+new Date().toLocaleTimeString());
      } else if(hasLocal){
        // Drive file is empty but local has data -> push local up
        setSyncStatus('spin','Uploading local data…');
        await saveToDrive();
      } else {
        setSyncStatus('ok','Synced (empty) '+new Date().toLocaleTimeString());
      }
      render();
    }else setSyncStatus('err','Load failed ('+r.status+')');
  }catch(e){setSyncStatus('err','Load error');console.error(e);}
}

// ── OAuth via GIS popup ──
function signIn(silent){
  if(!isCfg()){showSetupPanel();return;}
  if(!window.google||!google.accounts||!google.accounts.oauth2){
    setSyncStatus('err','Google library not loaded yet — please retry in a moment');
    return;
  }
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:async(resp)=>{
      if(resp.error||!resp.access_token){
        if(silent){setSyncStatus('err','Session expired — click sign in');renderAuthBar();return;}
        setSyncStatus('err','Auth failed: '+(resp.error||'no token'));return;
      }
      setToken(resp.access_token);
      // get user email
      try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}});const u=await r.json();_user=u.email||'Connected';localStorage.setItem('lft_user',_user);}catch(e){_user='Connected';}
      setSyncStatus('ok','Connected');
      await loadFromDrive();
      renderAuthBar();
    }
  }).requestAccessToken({prompt:silent?'':'consent'});
}

function signOut(){
  const t=getToken();
  if(t&&window.google)google.accounts.oauth2.revoke(t,()=>{});
  setToken(null);_fileId=null;_user='';
  localStorage.removeItem('lft_user');
  setSyncStatus('offline','Signed out');renderAuthBar();
}

function scheduleDriveSave(){clearTimeout(_timer);_timer=setTimeout(saveToDrive,2500);}

function renderAuthBar(){
  const bar=document.getElementById('auth-bar');if(!bar)return;
  const signed=!!getToken();
  _user=_user||localStorage.getItem('lft_user')||'';
  if(!isCfg()){
    bar.innerHTML=`<button class="gbtn" onclick="showSetupPanel()" style="color:var(--am);border-color:var(--am)">⚠️ Setup cloud sync</button>`;return;
  }
  bar.innerHTML=signed
    ?`<div class="sync-dot" id="sd" style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--gr)"></div>
       <span id="sl2" style="font-size:11px;color:var(--tx2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_user}</span>
       <button class="gbtn" onclick="loadFromDrive()" title="Sync">⟳</button>
       <button class="gbtn" onclick="signOut()" title="Sign out">↪</button>`
    :`<button class="gbtn" onclick="signIn()" style="color:var(--bl);border-color:var(--bl)">🔑 Google Drive</button>`;
}

// ── Setup panel ──
function showSetupPanel(){
  let p=document.getElementById('setupPanel');
  if(p){p.style.display='block';return;}
  const cur=localStorage.getItem('lft_client_id')||'';
  const usingDefault=CLIENT_ID===DEFAULT_CLIENT_ID&&!cur;
  p=document.createElement('div');
  p.id='setupPanel';
  p.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  p.innerHTML=`<div style="max-width:520px;width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:22px;color:var(--tx);max-height:90vh;overflow:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:16px;font-weight:800">☁️ Cloud sync setup</div>
      <button class="gbtn" onclick="hideSetupPanel()">✕</button>
    </div>
    <p style="font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.55">Life Tracker keeps everything in your own Google Drive (a private hidden folder only this app can read). You need a free <b>OAuth Client ID</b> from Google. Setup takes ~3 minutes.</p>
    <ol style="font-size:12px;color:var(--tx2);padding-left:20px;line-height:1.7;margin-bottom:14px">
      <li>Go to <a href="https://console.cloud.google.com/" target="_blank" style="color:var(--bl)">Google Cloud Console</a>, create a project.</li>
      <li>Enable the <a href="https://console.cloud.google.com/apis/library/drive.googleapis.com" target="_blank" style="color:var(--bl)">Google Drive API</a>.</li>
      <li><a href="https://console.cloud.google.com/apis/credentials/consent" target="_blank" style="color:var(--bl)">OAuth consent screen</a> → External → add your email under <b>Test users</b>.</li>
      <li><a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:var(--bl)">Credentials</a> → Create Credentials → OAuth client ID → Web application.<br/>
        Authorized JavaScript origins: <code style="background:var(--sf2);padding:1px 5px;border-radius:3px">${location.origin}</code></li>
      <li>Copy the generated Client ID and paste it below.</li>
    </ol>
    <label style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em">Your Client ID</label>
    <input id="cidIn" type="text" placeholder="123-abc.apps.googleusercontent.com" value="${cur.replace(/"/g,'&quot;')}" style="width:100%;font-size:12px;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-top:5px;margin-bottom:12px;font-family:monospace"/>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ab" onclick="setClientId(document.getElementById('cidIn').value)">Save &amp; use</button>
      <button class="gbtn" onclick="setClientId('')" title="Forget custom Client ID and use the default if any">Reset to default</button>
      <div style="flex:1"></div>
      <button class="gbtn" onclick="hideSetupPanel()">Skip — use local only</button>
    </div>
    ${usingDefault?'<p style="font-size:10px;color:var(--tx3);margin-top:10px">Currently using the bundled default Client ID. If sign-in fails with "origin_mismatch" or "access_denied", create your own Client ID using the steps above.</p>':''}
  </div>`;
  document.body.appendChild(p);
}
function hideSetupPanel(){const p=document.getElementById('setupPanel');if(p)p.style.display='none';}

// Auto-reconnect on load if token exists. If token is expired/invalid,
// silently try to get a fresh one via GIS so the user doesn't have to click.
async function tryAutoLogin(){
  if(!isCfg())return;
  const t=getToken();
  _user=localStorage.getItem('lft_user')||'';
  if(t){
    setSyncStatus('spin','Reconnecting…');
    // Probe token validity with a cheap call
    try{
      const r=await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token='+encodeURIComponent(t));
      if(r.ok){await loadFromDrive();return;}
    }catch(e){}
    // Token bad -> try silent reauth via GIS
    setToken(null);
  }
  // Silent attempt if we have a known user — GIS will pop only if needed
  if(_user&&window.google&&google.accounts&&google.accounts.oauth2){
    setSyncStatus('spin','Reconnecting…');
    signIn(true);
  }
}
// Wait for GIS library to load before attempting auto-login
function waitForGis(cb,tries){
  tries=tries||0;
  if(window.google&&google.accounts&&google.accounts.oauth2){cb();return;}
  if(tries>40){setSyncStatus('err','Google library failed to load');renderAuthBar();return;}
  setTimeout(()=>waitForGis(cb,tries+1),150);
}

const P=n=>String(n).padStart(2,'0');
const dk=(y,m,d)=>`${y}-${P(m+1)}-${P(d)}`;
const mk=(y,m)=>`${y}-${P(m+1)}`;
const smk=(y,s)=>`${y}-S${s+1}`;
const qk=(y,q)=>`${y}-Q${q}`;
const wk=(y,m,w)=>`${y}-${P(m+1)}-W${w}`;
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const firstMon=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
function mkeys(y,m){return Array.from({length:daysIn(y,m)},(_,i)=>dk(y,m,i+1))}
function ykeys(y){let k=[];for(let m=0;m<12;m++)k=[...k,...mkeys(y,m)];return k}
function smkeys(y,s){let k=[];for(let m=s*6;m<s*6+6;m++)k=[...k,...mkeys(y,m)];return k}
function qkeys(y,q){let k=[];for(let m=(q-1)*3;m<q*3;m++)k=[...k,...mkeys(y,m)];return k}
function weekRanges(y,m){const fd=firstMon(y,m),days=daysIn(y,m),rs=[];let s=1,w=1;while(s<=days){const dow=(fd+s-1)%7;const e=Math.min(s+(6-dow),days);rs.push({w,start:s,end:e});s=e+1;w++;}return rs;}
function weekOfDay(y,m,d){return weekRanges(y,m).find(w=>d>=w.start&&d<=w.end);}
const TDAY=dk(TY,TM,TD);
function isPast(dkey){return dkey<TDAY;}
function stats(tasks,keys){let tot=0,done=0,miss=0;keys.forEach(k=>(tasks[k]||[]).forEach(t=>{tot++;if(t.done)done++;else if(!t.carried&&isPast(k))miss++;}));return{tot,done,miss,pct:tot?Math.round(done/tot*100):0};}
function catStat(tasks,keys,cid){const all=keys.flatMap(k=>(tasks[k]||[]).filter(t=>t.cat===cid));const done=all.filter(t=>t.done).length;return{tot:all.length,done,pct:all.length?Math.round(done/all.length*100):0};}
// Multi-goal per category: {items:[{text,done}]}
function getGoalObj(key,cat){const v=(DATA.goals[key]||{})[cat];if(!v)return{items:[]};if(typeof v==='string')return{items:[{text:v,done:false}]};if(v.text!==undefined)return{items:[{text:v.text||'',done:!!v.done}]};return{items:[],...v};}
function saveGoalObj(key,cat,obj){if(!DATA.goals[key])DATA.goals[key]={};DATA.goals[key][cat]=obj;save();}

function setGoalItemText(key,cat,idx,text){const o=getGoalObj(key,cat);if(o.items[idx])o.items[idx].text=text;else o.items.push({text,done:false});saveGoalObj(key,cat,o);}
function addGoalItem(key,cat){const o=getGoalObj(key,cat);o.items.push({text:'',done:false});saveGoalObj(key,cat,o);render();}
function addGoalItemText(key,cat,text){const o=getGoalObj(key,cat);o.items.push({text,done:false});saveGoalObj(key,cat,o);render();}
function delGoalItem(key,cat,idx){const o=getGoalObj(key,cat);o.items.splice(idx,1);saveGoalObj(key,cat,o);render();}
function getGoal(key,cat){const o=getGoalObj(key,cat);return{text:o.items.map(i=>i.text).join('\n'),done:o.items.length>0&&o.items.every(i=>i.done)};}
function setGoalText(key,cat,text){if(!text.trim())return;const o=getGoalObj(key,cat);if(!o.items.length)o.items=[{text,done:false}];else o.items[o.items.length-1].text=text;saveGoalObj(key,cat,o);}
function toggleGoalDone(key,cat){const o=getGoalObj(key,cat);const all=o.items.every(i=>i.done);o.items=o.items.map(i=>({...i,done:!all}));saveGoalObj(key,cat,o);render();}

let DATA={goals:{},tasks:{},recurring:[],recurDone:{}};

function save(syncDrive=true){try{localStorage.setItem(SK,JSON.stringify(DATA));}catch(e){}if(syncDrive)scheduleDriveSave();}
function load(){try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);DATA={goals:{},tasks:{},recurring:[],recurDone:{},...d};}}catch(e){}}

function getDayTasks(dkey){
  const reg=DATA.tasks[dkey]||[];
  const rec=(DATA.recurring||[]).filter(r=>dkey>=r.startDate&&(!r.until||dkey<=r.until))
    .map(r=>({...r,id:'r_'+r.id,isRec:true,done:!!(DATA.recurDone[r.id+'_'+dkey])}));
  return [...reg,...rec];
}
function addTask(dkey,t){
  if(t.recur){DATA.recurring.push({...t,id:Date.now()+Math.random(),startDate:dkey,until:t.until||''});}
  else{if(!DATA.tasks[dkey])DATA.tasks[dkey]=[];DATA.tasks[dkey].push({...t,id:Date.now()+Math.random(),done:false,carried:false});}
  // Auto-add task title as a new goal item to the week's category
  const parts=dkey.split('-');const y=parseInt(parts[0]),m=parseInt(parts[1])-1,d=parseInt(parts[2]);
  const wr=weekOfDay(y,m,d);if(wr){const wkey=wk(y,m,wr.w);const o=getGoalObj(wkey,t.cat);if(!o.items.some(i=>i.text===t.title)){o.items.push({text:t.title,done:false});saveGoalObj(wkey,t.cat,o);}}
  save();
  // Auto open google calendar if time set
  if(t.time&&!t.recur){const[hh,mm]=t.time.split(':');const P2=n=>String(n).padStart(2,'0');const y2=parts[0],mo=parts[1],da=parts[2];const s=y2+mo+da+'T'+P2(hh)+P2(mm)+'00';const e=y2+mo+da+'T'+P2(Math.min(23,parseInt(hh)+1))+P2(mm)+'00';window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+s+'/'+e,'_blank');}
  render();
}
function toggleTask(dkey,id){
  const sid=String(id);
  if(sid.startsWith('r_')){const rid=sid.slice(2);DATA.recurDone[rid+'_'+dkey]=!DATA.recurDone[rid+'_'+dkey];}
  else{if(DATA.tasks[dkey])DATA.tasks[dkey]=DATA.tasks[dkey].map(t=>t.id==id?{...t,done:!t.done}:t);}
  save();render();
}
function delTask(dkey,id){
  const sid=String(id);
  if(sid.startsWith('r_')){DATA.recurring=DATA.recurring.filter(r=>String(r.id)!==sid.slice(2));}
  else{if(DATA.tasks[dkey])DATA.tasks[dkey]=DATA.tasks[dkey].filter(t=>t.id!=id);}
  save();render();
}
function carryPeriod(srcKeys,dstKey){
  const missed=srcKeys.flatMap(k=>(DATA.tasks[k]||[]).filter(t=>!t.done&&!t.carried));
  if(!missed.length){alert('No missed tasks to carry');return;}
  if(!DATA.tasks[dstKey])DATA.tasks[dstKey]=[];
  missed.forEach(t=>DATA.tasks[dstKey].push({...t,id:Date.now()+Math.random(),carried:true,done:false}));
  srcKeys.forEach(k=>{DATA.tasks[k]=(DATA.tasks[k]||[]).map(t=>!t.done?{...t,carried:true}:t);});
  save();render();alert('Carried '+missed.length+' task(s)');
}
function carryDay(){const pd=new Date(TODAY);pd.setDate(pd.getDate()-1);carryPeriod([dk(pd.getFullYear(),pd.getMonth(),pd.getDate())],dk(TY,TM,TD));}
function carryMonth(){const pm=VM===0?11:VM-1,py=VM===0?VY-1:VY;carryPeriod(mkeys(py,pm),dk(VY,VM,1));}
function carrySem(){const s=VM<6?1:0,sy=VM<6?VY-1:VY;carryPeriod(smkeys(sy,s),smkeys(VY,VM<6?0:1)[0]);}
function carryYear(){carryPeriod(ykeys(VY-1),dk(VY,0,1));}
function carryQ(){const cq=Math.ceil((VM+1)/3);const pqn=cq===1?4:cq-1;const py=pqn===4&&cq===1?VY-1:VY;const dst=qkeys(VY,cq)[0];carryPeriod(qkeys(py,pqn),dst);alert('Carried from Q'+pqn+' to Q'+cq);}
function carryW(){const cw=weekOfDay(VY,VM,SEL||TD);if(!cw)return;const pw=weekRanges(VY,VM).find(w=>w.w===cw.w-1);if(!pw){alert('No previous week');return;}const sk=Array.from({length:pw.end-pw.start+1},(_,i)=>dk(VY,VM,pw.start+i));carryPeriod(sk,dk(VY,VM,cw.start));}

  });

  const tbar=tpct!==null?`<div style="display:flex;align-items:center;gap:6px;margin-top:3px"><div style="flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden"><div style="height:3px;width:${tpct}%;background:${c.c};opacity:.5;border-radius:2px"></div></div><span style="font-size:9px;color:var(--tx3)">${tpct}% tasks</span></div>`:'';
  return `<div class="gc" style="border-left:2px solid ${c.c}">

      <span style="font-size:9px;color:var(--tx3)">${label}</span>
    </div>
    ${parentHtml||''}
    ${items}
    <div style="display:flex;align-items:center;gap:4px;margin-top:4px">
      <input id="${eid}" type="text" placeholder="+ Add goal, press Enter" style="flex:1;font-size:10px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:3px 6px"
        onkeydown="if(event.key==='Enter'&&this.value.trim()){addGoalItemText('${gkey}','${c.id}',this.value.trim());this.value='';event.preventDefault();}"/>
    </div>
    ${gbar}${tbar}
  </div>`;
}
function goalGrid(gkey,label,pkeys,parentGoalKeys){
  // parentGoalKeys: array of {key,label} for read-only parent goals shown above
  return `<div class="gg">${CATS.map(c=>{
    let parentHtml='';
    if(parentGoalKeys&&parentGoalKeys.length){
      parentHtml='<div style="border-bottom:1px solid var(--bd);margin-bottom:6px;padding-bottom:6px">';
      parentGoalKeys.forEach(p=>{
        const po=getGoalObj(p.key,c.id);
        if(po.items.length){
          parentHtml+=`<div style="font-size:9px;color:var(--tx3);font-weight:600;margin-bottom:2px">${p.label}</div>`;
          po.items.forEach(it=>{
            parentHtml+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px">
              <div style="flex-shrink:0;width:9px;height:9px;border-radius:50%;border:1.5px solid ${c.c};background:${it.done?c.c:'transparent'}"></div>
              <span style="font-size:9px;color:${it.done?'var(--tx3)':'var(--tx2)'};text-decoration:${it.done?'line-through':'none'}">${it.text.replace(/</g,'&lt;')}</span>
            </div>`;
          });
        }
      });
      parentHtml+='</div>';
    }
    return goalCard(gkey,c,label,pkeys,parentHtml);
  }).join('')}</div>`;
}

  CATS.forEach((c,i)=>{
    const bg=i%2?'background:var(--sf2)':'';
    const ypct=catStat(DATA.tasks,ykeys(VY),c.id).pct;
    const spct=catStat(DATA.tasks,smkeys(VY,VM<6?0:1),c.id).pct;
    const qpct=catStat(DATA.tasks,qkeys(VY,qnum),c.id).pct;
    const mpct=catStat(DATA.tasks,mkeys(VY,VM),c.id).pct;
    function tcell(gk,tpct,editable){
      const o=getGoalObj(gk,c.id);
      const gd=o.items.filter(i=>i.done).length,gt=o.items.length;
      const gpct=gt?Math.round(gd/gt*100):0;
      const eid2='tc_'+gk.replace(/[^a-z0-9]/gi,'_')+'_'+c.id;
      let rows=o.items.map((it,idx)=>`<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
        <div onclick="toggleGoalItem('${gk}','${c.id}',${idx})" style="flex-shrink:0;width:11px;height:11px;border-radius:50%;border:2px solid ${c.c};background:${it.done?c.c:'transparent'};cursor:pointer"></div>
        <span style="font-size:10px;color:${it.done?'var(--tx3)':'var(--tx)'};text-decoration:${it.done?'line-through':'none'}">${it.text.replace(/</g,'&lt;')||'—'}</span>
      </div>`).join('');
      const addRow=editable?`<input id="${eid2}" type="text" placeholder="+ goal, Enter" style="width:100%;font-size:9px;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:2px 5px;margin-top:3px" onkeydown="if(event.key==='Enter'&&this.value.trim()){addGoalItemText('${gk}','${c.id}',this.value.trim());this.value='';event.preventDefault();}"/>`:'';
      const gbar=gt?`<div style="display:flex;align-items:center;gap:4px;margin-top:3px"><div style="flex:1;height:2px;background:var(--bd);border-radius:2px"><div style="height:2px;width:${gpct}%;background:${c.c}"></div></div><span style="font-size:8px;color:var(--tx3)">${gpct}%</span></div>`:'';
      const tbar=`<div style="display:flex;align-items:center;gap:4px;margin-top:2px"><div style="flex:1;height:2px;background:var(--bd);border-radius:2px"><div style="height:2px;width:${tpct}%;background:${c.c};opacity:.5"></div></div><span style="font-size:8px;color:var(--tx3)">${tpct}% tasks</span></div>`;
      return `<td style="padding:6px 10px;${bg};min-width:130px;vertical-align:top">${rows||'<span style="font-size:9px;color:var(--tx3)">No goals</span>'}${addRow}${gbar}${tbar}</td>`;
    }
    h+=`<tr style="border-top:1px solid var(--bd)">
      <td style="padding:8px 10px;color:${c.c};font-weight:700;white-space:nowrap;${bg}">${c.i} ${c.l}</td>
      ${tcell(String(VY),ypct,false)}
      ${tcell(skey,spct,true)}
      ${tcell(qkey,qpct,true)}
      ${tcell(mkey,mpct,true)}
    </tr>`;
  });
  h+=`</tbody></table></div>`;

  // WEEK GOALS - tasks shown as circles, auto-mark when all tasks done
  h+=`<div class="sl">WEEK GOALS (Mon → Sun)</div>`;
  wrs.forEach(({w,start,end})=>{
    const wkey=wk(VY,VM,w);
    const wdkeys=Array.from({length:end-start+1},(_,i)=>dk(VY,VM,start+i));
    const isNow=todayW&&todayW.w===w;
    const ws=stats(DATA.tasks,wdkeys);
    h+=`<div style="margin-bottom:16px;${isNow?'border-left:3px solid var(--bl);padding-left:10px;margin-left:-10px':''}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:12px;font-weight:700;color:${isNow?'var(--bl)':'var(--tx2)'}">W${w} — ${MO[VM]} ${start}${start!==end?'–'+end:''}</span>
      ${isNow?'<span style="font-size:10px;background:var(--bld);color:var(--bl);border-radius:4px;padding:1px 6px">This Week</span>':''}
      ${pills(ws)}
    </div>
    <div class="gg">`;
    CATS.forEach(c=>{
      const wo=getGoalObj(wkey,c.id);
      // Collect all tasks for this cat in the week
      const wTasks=wdkeys.flatMap(dkey2=>{
        const all=getDayTasks(dkey2).filter(t=>t.cat===c.id);
        return all.map(t=>({...t,_dk:dkey2}));
      });
      // Auto-sync: if a task title matches a goal item, sync done state
      wo.items.forEach((it,idx)=>{
        const match=wTasks.find(t=>t.title===it.text);
        if(match&&match.done!==it.done){it.done=match.done;}
      });
      const wpct=catStat(DATA.tasks,wdkeys,c.id).pct;
      const gd=wo.items.filter(i=>i.done).length,gt=wo.items.length;
      const gpct=gt?Math.round(gd/gt*100):0;
      const eid3='wi_'+wkey.replace(/[^a-z0-9]/gi,'_')+'_'+c.id;
      // Task rows as circles
      let taskRows=wTasks.map(t=>`<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
        <div onclick="toggleTask('${t._dk}','${t.id}')" style="flex-shrink:0;width:11px;height:11px;border-radius:50%;border:2px solid ${c.c};background:${t.done?c.c:'transparent'};cursor:pointer"></div>
        <span style="font-size:10px;color:${t.done?'var(--tx3)':'var(--tx)'};text-decoration:${t.done?'line-through':'none'}">${t.title}${t.time?' ⏰'+t.time:''}</span>
        ${t.isRec?'<span style="font-size:8px;color:var(--bl)">🔁</span>':''}
      </div>`).join('');
      // Extra manual goals
      let goalRows=wo.items.filter(it=>!wTasks.some(t=>t.title===it.text)).map((it,idx)=>`<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
        <div onclick="toggleGoalItem('${wkey}','${c.id}',${idx})" style="flex-shrink:0;width:11px;height:11px;border-radius:50%;border:1.5px dashed ${c.c};background:${it.done?c.c:'transparent'};cursor:pointer"></div>
        <input value="${it.text.replace(/"/g,'&quot;')}" onblur="setGoalItemText('${wkey}','${c.id}',${idx},this.value)" style="flex:1;font-size:10px;color:${it.done?'var(--tx3)':'var(--tx)'};text-decoration:${it.done?'line-through':'none'};background:none;border:none;outline:none"/>
        <button onclick="delGoalItem('${wkey}','${c.id}',${idx})" style="font-size:9px;color:var(--tx3)">✕</button>
      </div>`).join('');
      h+=`<div class="gc" style="border-left:2px solid ${c.c}">
        <div style="font-size:10px;font-weight:600;color:${c.c};margin-bottom:5px">${c.i} ${c.l}</div>
        ${taskRows||''}${goalRows||''}
        <input id="${eid3}" type="text" placeholder="+ goal, Enter" style="width:100%;font-size:10px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;margin-top:4px" onkeydown="if(event.key==='Enter'&&this.value.trim()){addGoalItemText('${wkey}','${c.id}',this.value.trim());this.value='';}"/>
        <div style="display:flex;align-items:center;gap:5px;margin-top:4px">
          <div style="flex:1;height:3px;background:var(--bd);border-radius:2px"><div style="height:3px;width:${wpct}%;background:${c.c};opacity:.5;border-radius:2px"></div></div>
          <span style="font-size:8px;color:var(--tx3)">${wpct}% tasks</span>
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });

  // CALENDAR (Mon–Sun, week highlight, time shown)
  h+=`<div class="sl" style="margin-top:8px">CALENDAR — click day to add tasks</div>
  <div class="cw"><div class="ch">`;
  DH.forEach(d=>{h+=`<div>${d}</div>`;});
  h+=`</div><div class="cb">`;
  for(let e=0;e<fd;e++)h+=`<div class="cc emp"></div>`;
  for(let d=1;d<=days;d++){
    const dk2=dk(VY,VM,d);const dt=getDayTasks(dk2);
    const done=dt.filter(t=>t.done).length;
    const isT=VY===TY&&VM===TM&&d===TD,isSel=SEL===d;
    const hasMiss=dt.some(t=>!t.done&&!t.carried);
    const inW=highlightW&&d>=highlightW.start&&d<=highlightW.end;
    const dots=CATS.filter(c=>dt.some(t=>t.cat===c.id)).map(c=>`<div class="dot" style="background:${c.c}"></div>`).join('');
    const firstTime=(dt.find(t=>t.time)||{}).time;
    h+=`<div class="cc${isSel?' sel':isT?' tod':''} ${inW?'inw':''}" onclick="selDay(${d})">
      <div class="cdn${isT?' tdn':isSel?' sdn':''}">${d}</div>
      ${dt.length?`<div class="ctc" style="color:${hasMiss?'var(--rd)':'var(--gr)'}">${done}/${dt.length}</div>`:''}
      ${firstTime?`<div class="ctm">⏰${firstTime}</div>`:''}
      <div class="dots">${dots}</div>
    </div>`;
  }
  const rem=(fd+days)%7?7-(fd+days)%7:0;
  for(let e=0;e<rem;e++)h+=`<div class="cc emp"></div>`;
  h+=`</div></div>`;

  // DAY PANEL
  if(SEL){
    h+=`<div class="dp"><div class="dpt">
      <span>${MF[VM]} ${SEL}${selW?' — W'+selW.w:''}</span>
      <button class="gb" onclick="openGcal()">📅 Google Cal</button>
    </div>`;
    if(!dayTasks.length)h+=`<div class="nt2">No tasks — add below.</div>`;
    dayTasks.forEach(t=>{
      const cat=CATS.find(c=>c.id===t.cat)||{c:'var(--tx3)'};
      h+=`<div class="tr">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${dkey}','${t.id}')"/>
        <span class="tt${t.done?' done':''}">${t.title}</span>
        ${t.time?`<span class="tim">⏰${t.time}</span>`:''}
        ${t.isRec?`<span class="rec">🔁 daily</span>`:''}
        ${t.carried?`<span class="car">carried</span>`:''}
        <div class="tdot" style="background:${cat.c}"></div>
        <button class="td" onclick="delTask('${dkey}','${t.id}')">✕</button>
      </div>`;
    });
    const opts=CATS.map(c=>`<option value="${c.id}"${NT.cat===c.id?' selected':''}>${c.i} ${c.l}</option>`).join('');
    h+=`<div class="ar">
      <select class="as" onchange="NT.cat=this.value">${opts}</select>
      <input class="ai" type="text" placeholder="Task title…" value="${NT.title}" oninput="NT.title=this.value" onkeydown="if(event.key==='Enter')doAdd()"/>
      <input class="at" type="time" value="${NT.time}" oninput="NT.time=this.value"/>
      <button class="ab" onclick="doAdd()">+ Add</button>
    </div>
    <div class="ar" style="margin-top:4px;align-items:center">
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);cursor:pointer">
        <input type="checkbox" ${NT.recur?'checked':''} onchange="NT.recur=this.checked;document.getElementById('uw').style.display=this.checked?'flex':'none'" style="width:14px;height:14px"/>
        🔁 Recurring daily
      </label>
      <span id="uw" style="display:${NT.recur?'flex':'none'};align-items:center;gap:4px;font-size:11px;color:var(--tx2)">
        Until: <input class="at" type="date" value="${NT.until}" oninput="NT.until=this.value" style="width:120px"/>
      </span>
    </div></div>`;
  }

  h+=`<div class="sl" style="margin-top:8px">MONTH SUMMARY</div>${sumBox(ms,mkeys(VY,VM))}</div>`;
  document.getElementById('R').innerHTML=h;
}

function goHome(){VIEW='home';SEL=null;render();}
function goYear(y){VY=y;VIEW='year';SEL=null;render();}
function goMonth(m){VM=m;VIEW='month';SEL=null;render();}
function selDay(d){SEL=SEL===d?null:d;render();}
function doAdd(){if(!NT.title.trim()||!SEL)return;addTask(dk(VY,VM,SEL),{cat:NT.cat,title:NT.title.trim(),time:NT.time,recur:NT.recur,until:NT.until});NT={cat:NT.cat,title:'',time:'',recur:false,until:''};}
function openGcal(){if(!SEL)return;const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(MF[VM]+' '+SEL)}&dates=${VY}${P(VM+1)}${P(SEL)}/${VY}${P(VM+1)}${P(SEL+1)}&sf=true&output=xml`;window.open(url,'_blank');}
// Load theme
if(localStorage.getItem('lft_theme')==='light')document.body.classList.add('light');
load();render();
renderAuthBar();
// Wait for the Google Identity Services script to finish loading, then
// auto-reconnect if we have a stored session.
waitForGis(()=>{tryAutoLogin();});
</script>
</body>
</html>
