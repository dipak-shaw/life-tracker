<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Life Tracker</title>
<style>
:root{--bg:#0f0f0f;--sf:#181818;--sf2:#222;--bd:#2e2e2e;--bd2:#3a3a3a;--tx:#f0ede8;--tx2:#9a9690;--tx3:#5a5652;--gr:#4ade80;--gd:#1a3a27;--rd:#f87171;--rdd:#3a1a1a;--am:#fbbf24;--amd:#3a2a00;--bl:#60a5fa;--bld:#1a2a3a;--r:10px}
body.light{--bg:#f5f4f0;--sf:#fff;--sf2:#f0eeea;--bd:#e0ddd8;--bd2:#c8c4be;--tx:#1a1a1a;--tx2:#6a6660;--tx3:#aaa8a4;--gd:#d4f7e4;--rdd:#fde8e8;--amd:#fff8e0;--bld:#e8f0ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:var(--tx)}
input,textarea,select{font-family:inherit;color:var(--tx);background:none;border:none;outline:none}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--gr);cursor:pointer;flex-shrink:0}
#toolbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
#toolbar .title{font-size:13px;font-weight:800;letter-spacing:-.01em}
#toolbar .spacer{flex:1}
.tbtn{font-size:11px;border:1px solid var(--bd2);border-radius:6px;padding:4px 10px;background:var(--sf2);color:var(--tx);cursor:pointer}
.tbtn:hover{border-color:var(--tx2)}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.sok{background:var(--gr)}.serr{background:var(--rd)}.sspin{background:var(--am);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:960px;margin:0 auto;padding:20px 16px 80px}
.bb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:500;color:var(--tx2);background:var(--sf);margin-bottom:14px;cursor:pointer}
.bb:hover{color:var(--tx);border-color:var(--tx2)}
.tb{display:flex;align-items:center;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.pt{font-size:26px;font-weight:800;flex:1;letter-spacing:-.02em}
.sp{display:inline-flex;align-items:center;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600}
.sg{background:var(--gd);color:var(--gr)}.sr{background:var(--rdd);color:var(--rd)}.sc{color:var(--tx2);font-size:12px}
.sl{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
.pbar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:4px}
.pf{height:3px;border-radius:2px;transition:width .3s}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.yc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .15s}
.yc:hover{background:var(--sf2);border-color:var(--bd2);transform:translateY(-1px)}
.yc.now{background:var(--bld);border-color:var(--bl)}
.yn{font-size:24px;font-weight:800;margin-bottom:2px}.yc.now .yn{color:var(--bl)}
.ym{font-size:11px;color:var(--tx3);margin-bottom:8px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin-bottom:18px}
.gc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;transition:border-color .15s}
.gc:focus-within{border-color:var(--bd2)}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.st{font-size:14px;font-weight:700}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:24px}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 10px;cursor:pointer;text-align:center;transition:all .15s}
.mc:hover{background:var(--sf2);transform:translateY(-1px)}
.mc.mn{background:var(--bld);border-color:var(--bl)}
.mcn{font-size:13px;font-weight:600;margin-bottom:3px}.mc.mn .mcn{color:var(--bl)}
.mcp{font-size:10px;color:var(--tx3);margin-bottom:6px}
.sb{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:20px}
.sn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;text-align:center}
.snum{font-size:24px;font-weight:800}.slb{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.cbr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cbn{font-size:11px;color:var(--tx2);width:70px}.cbt{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.cbf{height:4px;border-radius:2px}.cbp{font-size:11px;color:var(--tx3);width:28px;text-align:right}
.cw{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.ch{display:grid;grid-template-columns:repeat(7,1fr);background:var(--sf2);border-bottom:1px solid var(--bd)}
.ch div{text-align:center;padding:7px 0;font-size:10px;font-weight:600;color:var(--tx3)}
.cb{display:grid;grid-template-columns:repeat(7,1fr)}
.cc{min-height:56px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px;cursor:pointer;transition:background .1s}
.cc:hover{background:var(--sf2)}.cc.tod{background:var(--bld)}.cc.sel{background:var(--amd)}
.cc.inw{box-shadow:inset 0 0 0 1px #3a3a6a}.cc.emp{opacity:.15;cursor:default;pointer-events:none}
.cdn{font-size:11px;font-weight:500}.cdn.tdn{color:var(--bl);font-weight:800}.cdn.sdn{color:var(--am)}
.ctc{font-size:9px;margin-top:1px}.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}.dot{width:5px;height:5px;border-radius:50%}
.ctm{font-size:8px;color:var(--am);margin-top:1px}
.dp{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.dpt{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.tr{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--bd)}.tr:last-of-type{border:none}
.tt{flex:1;font-size:12px}.tt.done{text-decoration:line-through;color:var(--tx3)}
.tim{font-size:10px;color:var(--tx3)}.car{font-size:9px;background:var(--amd);color:var(--am);border-radius:3px;padding:1px 5px}
.rec{font-size:9px;background:#1a1a3a;color:var(--bl);border-radius:3px;padding:1px 5px}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.td{font-size:12px;color:var(--tx3)}.td:hover{color:var(--rd)}
.ar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.as,.ai,.at{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--tx);font-family:inherit}
.ai{flex:1;min-width:80px}.ai::placeholder{color:var(--tx3)}.at{width:90px}
.ab{background:var(--gd);color:var(--gr);border:1px solid var(--gd);border-radius:7px;padding:5px 12px;font-size:11px;font-weight:600}
.ab:hover{background:var(--gr);color:#0f0f0f}
.xb{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:10px;color:var(--tx2);cursor:pointer}
.xb:hover{color:var(--tx);border-color:var(--tx2)}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ai2{animation:fi .18s ease}
</style>
</head>
<body>
<div id="toolbar">
  <span class="title">Life Tracker</span>
  <div class="spacer"></div>
  <div id="auth-bar"></div>
  <div style="width:1px;height:14px;background:var(--bd);margin:0 2px"></div>
  <button class="tbtn" onclick="exportData()" title="Export backup">⬇️</button>
  <button class="tbtn" onclick="importData()" title="Import backup">⬆️</button>
  <button class="tbtn" onclick="showCatManager()" title="Edit categories">⚙️</button>
  <button id="themeBtn" class="tbtn" onclick="toggleTheme()">☀️</button>
</div>
<div class="app"><div id="R"></div></div>
<script>
// ─── SYNC via JSONBin.io ─────────────────────────────────────────
// Free at jsonbin.io — no OAuth, just an API key
let _jkey=localStorage.getItem('lft_jkey')||'';
let _jbin=localStorage.getItem('lft_jbin')||'';
let _stimer=null,_user='';

function getJ(){return{key:localStorage.getItem('lft_jkey')||'',bin:localStorage.getItem('lft_jbin')||''};}
function isCfg(){const j=getJ();return j.key&&j.bin;}

function setSS(cls,msg){
  const d=document.getElementById('sd'),l=document.getElementById('sl2');
  if(d)d.className='sync-dot s'+cls;
  if(l)l.textContent=msg;
}

async function saveToDrive(){
  const {key,bin}=getJ();if(!key||!bin)return;
  setSS('spin','Saving…');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${bin}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':key},body:JSON.stringify(DATA)});
    setSS(r.ok?'ok':'err',r.ok?'Saved '+new Date().toLocaleTimeString():'Save failed');
  }catch(e){setSS('err','Offline');}
}

async function loadFromDrive(){
  const {key,bin}=getJ();if(!key||!bin)return;
  setSS('spin','Syncing…');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`,{headers:{'X-Master-Key':key}});
    if(!r.ok){setSS('err','Sync failed');return;}
    const d=await r.json();
    if(d.record){DATA={goals:{},tasks:{},recurring:[],recurDone:{},...d.record};loadCats();save(false);}
    setSS('ok','Synced '+new Date().toLocaleTimeString());render();
  }catch(e){setSS('err','Offline');}
}

async function createBin(key){
  const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Name':'life-tracker'},body:JSON.stringify(DATA)});
  if(!r.ok)return null;
  const d=await r.json();return d.metadata&&d.metadata.id;
}

async function signIn(){
  const key=prompt('Paste your JSONBin API Key:\n\n1. Go to jsonbin.io → Sign up free\n2. Account → API Keys → copy Secret Key\n3. Paste it here',getJ().key||'');
  if(!key||!key.trim()){return;}
  const k=key.trim();
  let bin=getJ().bin;
  if(!bin){
    setSS('spin','Creating storage…');
    bin=await createBin(k);
    if(!bin){alert('Invalid API key or network error. Check your key and try again.');setSS('err','Failed');renderAuthBar();return;}
  }
  localStorage.setItem('lft_jkey',k);
  localStorage.setItem('lft_jbin',bin);
  localStorage.setItem('lft_user','JSONBin synced');
  _user='JSONBin synced';
  setSS('ok','Connected');
  renderAuthBar();
  await loadFromDrive();
}

function signOut(){
  localStorage.removeItem('lft_jkey');localStorage.removeItem('lft_jbin');localStorage.removeItem('lft_user');
  _user='';setSS('','');renderAuthBar();
}

function schedSave(){clearTimeout(_stimer);_stimer=setTimeout(saveToDrive,2500);}

function renderAuthBar(){
  const bar=document.getElementById('auth-bar');if(!bar)return;
  _user=localStorage.getItem('lft_user')||'';
  const signed=isCfg();
  bar.innerHTML=signed
    ?`<div style="display:flex;align-items:center;gap:5px">
        <div id="sd" class="sync-dot sok"></div>
        <span id="sl2" style="font-size:11px;color:var(--tx2)">${_user}</span>
        <button class="tbtn" onclick="loadFromDrive()">⟳ Sync</button>
        <button class="tbtn" onclick="signOut()">↪</button></div>`
    :`<button onclick="signIn()" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border:1.5px solid var(--bl);border-radius:6px;padding:4px 10px;background:var(--bld);color:var(--bl);cursor:pointer">☁️ Setup Sync</button>`;
}
// ─── DATA ────// ─── DATA ────────────────────────────────────────────────────────
const SK='lft_v8';
let DATA={goals:{},tasks:{},recurring:[],recurDone:{}};
function save(sync=true){try{localStorage.setItem(SK,JSON.stringify(DATA));}catch(e){}if(sync)schedSave();}
function load(){try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);DATA={goals:{},tasks:{},recurring:[],recurDone:{},...d};}}catch(e){}loadCats();}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}));a.download='life-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);DATA={goals:{},tasks:{},recurring:[],recurDone:{},...d};loadCats();save();render();alert('Imported!');}catch(x){alert('Invalid file');}};r.readAsText(e.target.files[0]);};i.click();}
function toggleTheme(){document.body.classList.toggle('light');const l=document.body.classList.contains('light');localStorage.setItem('lft_theme',l?'light':'dark');document.getElementById('themeBtn').textContent=l?'🌙':'☀️';}
// ─── CONSTANTS ───────────────────────────────────────────────────
const DEFAULT_CATS=[
  {id:'personal',l:'Personal',i:'👤',c:'#a78bfa'},
  {id:'health',l:'Health',i:'💪',c:'#4ade80'},
  {id:'wealth',l:'Wealth',i:'💰',c:'#fbbf24'},
  {id:'travel',l:'Travel',i:'✈️',c:'#60a5fa'},
  {id:'branding',l:'Branding',i:'⭐',c:'#fb923c'},
  {id:'content',l:'Content',i:'✏️',c:'#f472b6'},
];
const COLORS=['#a78bfa','#4ade80','#fbbf24','#60a5fa','#fb923c','#f472b6','#34d399','#f87171','#818cf8','#fb7185','#38bdf8','#a3e635'];
const ICONS=['👤','💪','💰','✈️','⭐','✏️','🏠','📊','🎯','🔥','💡','🎓','🤝','🧠','📱','🏋️'];
let CATS=[];
function loadCats(){CATS=DATA.cats&&DATA.cats.length?DATA.cats:JSON.parse(JSON.stringify(DEFAULT_CATS));}
function saveCats(){DATA.cats=CATS;save();}
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DH=['Mo','Tu','We','Th','Fr','Sa','Su'];
const TODAY=new Date(),TY=TODAY.getFullYear(),TM=TODAY.getMonth(),TD=TODAY.getDate();
const YEARS=Array.from({length:10},(_,i)=>TY-2+i);
const P=n=>String(n).padStart(2,'0');
const dk=(y,m,d)=>`${y}-${P(m+1)}-${P(d)}`;
const mk=(y,m)=>`${y}-${P(m+1)}`;
const smk=(y,s)=>`${y}-S${s+1}`;
const qk=(y,q)=>`${y}-Q${q}`;
const wk=(y,m,w)=>`${y}-${P(m+1)}-W${w}`;
const TDAY=dk(TY,TM,TD);
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const firstMon=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
function mkeys(y,m){return Array.from({length:daysIn(y,m)},(_,i)=>dk(y,m,i+1));}
function ykeys(y){let k=[];for(let m=0;m<12;m++)k=[...k,...mkeys(y,m)];return k;}
function smkeys(y,s){let k=[];for(let m=s*6;m<s*6+6;m++)k=[...k,...mkeys(y,m)];return k;}
function qkeys(y,q){let k=[];for(let m=(q-1)*3;m<q*3;m++)k=[...k,...mkeys(y,m)];return k;}
function weekRanges(y,m){const fd=firstMon(y,m),days=daysIn(y,m),rs=[];let s=1,w=1;while(s<=days){const dow=(fd+s-1)%7;const e=Math.min(s+(6-dow),days);rs.push({w,start:s,end:e});s=e+1;w++;}return rs;}
function weekOfDay(y,m,d){return weekRanges(y,m).find(w=>d>=w.start&&d<=w.end);}
function stats(tasks,keys){let tot=0,done=0,miss=0;keys.forEach(k=>(tasks[k]||[]).forEach(t=>{tot++;if(t.done)done++;else if(!t.carried&&k<TDAY)miss++;}));return{tot,done,miss,pct:tot?Math.round(done/tot*100):0};}
function catStat(tasks,keys,cid){const all=keys.flatMap(k=>(tasks[k]||[]).filter(t=>t.cat===cid));const d=all.filter(t=>t.done).length;return{tot:all.length,done:d,pct:all.length?Math.round(d/all.length*100):0};}
// ─── GOALS ───────────────────────────────────────────────────────
function getGO(key,cat){const v=(DATA.goals[key]||{})[cat];if(!v)return{items:[]};if(typeof v==='string')return{items:[{text:v,done:false}]};if(v.text!==undefined)return{items:[{text:v.text||'',done:!!v.done}]};return{items:[],...v};}
function saveGO(key,cat,obj){if(!DATA.goals[key])DATA.goals[key]={};DATA.goals[key][cat]=obj;save();}
function toggleGI(key,cat,idx){const o=getGO(key,cat);if(o.items[idx])o.items[idx].done=!o.items[idx].done;saveGO(key,cat,o);render();}
function setGIT(key,cat,idx,text){const o=getGO(key,cat);if(o.items[idx])o.items[idx].text=text;saveGO(key,cat,o);}
function addGIT(key,cat,text){const o=getGO(key,cat);o.items.push({text,done:false});saveGO(key,cat,o);render();}
function delGI(key,cat,idx){const o=getGO(key,cat);o.items.splice(idx,1);saveGO(key,cat,o);render();}
// ─── TASKS ───────────────────────────────────────────────────────
function getDT(dkey){
  const reg=DATA.tasks[dkey]||[];
  const rec=(DATA.recurring||[]).filter(r=>dkey>=r.startDate&&(!r.until||dkey<=r.until)).map(r=>({...r,id:'r_'+r.id,isRec:true,done:!!(DATA.recurDone[r.id+'_'+dkey])}));
  return [...reg,...rec];
}
function addTask(dkey,t){
  if(t.recur){if(!DATA.recurring)DATA.recurring=[];DATA.recurring.push({...t,id:Date.now()+Math.random(),startDate:dkey,until:t.until||''});}
  else{if(!DATA.tasks[dkey])DATA.tasks[dkey]=[];DATA.tasks[dkey].push({...t,id:Date.now()+Math.random(),done:false,carried:false});}
  const pts=dkey.split('-');const wy=parseInt(pts[0]),wm=parseInt(pts[1])-1,wd=parseInt(pts[2]);
  const wr=weekOfDay(wy,wm,wd);if(wr){const wkey=wk(wy,wm,wr.w);const o=getGO(wkey,t.cat);if(!o.items.some(i=>i.text===t.title)){o.items.push({text:t.title,done:false});saveGO(wkey,t.cat,o);}}
  save();
  if(t.time&&!t.recur){const[hh,mm]=t.time.split(':');const s=`${pts[0]}${pts[1]}${pts[2]}T${P(hh)}${P(mm)}00`;const e=`${pts[0]}${pts[1]}${pts[2]}T${P(Math.min(23,parseInt(hh)+1))}${P(mm)}00`;window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${s}/${e}`,'_blank');}
  render();
}
function toggleTask(dkey,id){
  const sid=String(id);
  if(sid.startsWith('r_')){const rid=sid.slice(2);DATA.recurDone[rid+'_'+dkey]=!DATA.recurDone[rid+'_'+dkey];}
  else if(DATA.tasks[dkey])DATA.tasks[dkey]=DATA.tasks[dkey].map(t=>t.id==id?{...t,done:!t.done}:t);
  save();render();
}
let EDIT=null; // {dkey, id}
function startEdit(dkey,id){EDIT={dkey,id};render();}
function cancelEdit(){EDIT=null;render();}
function saveEdit(dkey,id){
  const t=document.getElementById('et').value.trim();
  const ti=document.getElementById('eti').value;
  const cat=document.getElementById('ecat').value;
  if(!t)return;
  if(DATA.tasks[dkey])DATA.tasks[dkey]=DATA.tasks[dkey].map(tk=>tk.id==id?{...tk,title:t,time:ti,cat}:tk);
  save();EDIT=null;render();
}
function delTask(dkey,id){
  const sid=String(id);
  if(sid.startsWith('r_'))DATA.recurring=DATA.recurring.filter(r=>String(r.id)!==sid.slice(2));
  else if(DATA.tasks[dkey])DATA.tasks[dkey]=DATA.tasks[dkey].filter(t=>t.id!=id);
  save();render();
}
function carryPeriod(srcKeys,dstKey){
  const missed=srcKeys.flatMap(k=>(DATA.tasks[k]||[]).filter(t=>!t.done&&!t.carried));
  if(!missed.length){alert('No missed tasks to carry');return;}
  if(!DATA.tasks[dstKey])DATA.tasks[dstKey]=[];
  missed.forEach(t=>DATA.tasks[dstKey].push({...t,id:Date.now()+Math.random(),carried:true,done:false}));
  srcKeys.forEach(k=>DATA.tasks[k]=(DATA.tasks[k]||[]).map(t=>!t.done?{...t,carried:true}:t));
  save();render();alert('Carried '+missed.length+' tasks');
}
function carryDay(){const pd=new Date(TODAY);pd.setDate(pd.getDate()-1);carryPeriod([dk(pd.getFullYear(),pd.getMonth(),pd.getDate())],TDAY);}
function carryMonth(){const pm=VM===0?11:VM-1,py=VM===0?VY-1:VY;carryPeriod(mkeys(py,pm),dk(VY,VM,1));}
function carryQ(){const cq=Math.ceil((VM+1)/3),pq=cq===1?4:cq-1,py=pq===4&&cq===1?VY-1:VY;carryPeriod(qkeys(py,pq),qkeys(VY,cq)[0]);}
function carrySem(){const s=VM<6?1:0,sy=VM<6?VY-1:VY;carryPeriod(smkeys(sy,s),smkeys(VY,VM<6?0:1)[0]);}
function carryYear(){carryPeriod(ykeys(VY-1),dk(VY,0,1));}

let VIEW='home',VY=TY,VM=TM,SEL=null,NT={cat:'health',title:'',time:'',recur:false,until:''};
const pills=s=>`<span class="sp sg">✓${s.done}</span><span class="sp sr" style="margin-left:4px">✗${s.miss}</span><span class="sc" style="margin-left:6px">${s.pct}%</span>`;
const pb=(pct,col)=>`<div class="pbar"><div class="pf" style="width:${pct}%;background:${col||'var(--gr)'}"></div></div>`;
const xb=(l,fn)=>`<button class="xb" onclick="${fn}">${l}</button>`;
function catBars(keys){return CATS.map(c=>{const cs=catStat(DATA.tasks,keys,c.id);if(!cs.tot)return'';return `<div class="cbr"><span class="cbn">${c.i} ${c.l}</span><div class="cbt"><div class="cbf" style="width:${cs.pct}%;background:${c.c}"></div></div><span class="cbp">${cs.pct}%</span></div>`;}).join('');}
function sumBox(s,keys){return `<div class="sb"><div class="sn"><div><div class="snum">${s.tot}</div><div class="slb">Total</div></div><div><div class="snum" style="color:var(--gr)">${s.done}</div><div class="slb">Done</div></div><div><div class="snum" style="color:var(--rd)">${s.miss}</div><div class="slb">Missed</div></div><div><div class="snum">${s.pct}%</div><div class="slb">Goal%</div></div></div>${catBars(keys)}</div>`;}
function goalCard(gkey,c,label,pkeys,parentHtml){
  const o=getGO(gkey,c.id);
  const gd=o.items.filter(i=>i.done).length,gt=o.items.length;
  const gpct=gt?Math.round(gd/gt*100):0;
  const tpct=pkeys?catStat(DATA.tasks,pkeys,c.id).pct:null;
  const eid='gi_'+gkey.replace(/[^a-z0-9]/gi,'_')+'_'+c.id;
  let rows=o.items.map((it,idx)=>`<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
    <div onclick="toggleGI('${gkey}','${c.id}',${idx})" style="flex-shrink:0;width:13px;height:13px;border-radius:50%;border:2px solid ${c.c};background:${it.done?c.c:'transparent'};cursor:pointer;transition:background .2s"></div>
    <input value="${it.text.replace(/"/g,'&quot;')}" onblur="setGIT('${gkey}','${c.id}',${idx},this.value)" style="flex:1;font-size:11px;color:${it.done?'var(--tx3)':'var(--tx)'};text-decoration:${it.done?'line-through':'none'};background:none;border:none;outline:none"/>
    <button onclick="delGI('${gkey}','${c.id}',${idx})" style="font-size:10px;color:var(--tx3)">✕</button>
  </div>`).join('');
  const gbar=gt?`<div style="display:flex;align-items:center;gap:5px;margin-top:4px"><div style="flex:1;height:3px;background:var(--bd);border-radius:2px"><div style="height:3px;width:${gpct}%;background:${c.c};border-radius:2px"></div></div><span style="font-size:9px;color:var(--tx3)">${gd}/${gt} ${gpct}%</span></div>`:'';
  const tbar=tpct!==null?`<div style="display:flex;align-items:center;gap:5px;margin-top:2px"><div style="flex:1;height:2px;background:var(--bd);border-radius:2px"><div style="height:2px;width:${tpct}%;background:${c.c};opacity:.5;border-radius:2px"></div></div><span style="font-size:9px;color:var(--tx3)">${tpct}% tasks</span></div>`:'';
  return `<div class="gc" style="border-left:2px solid ${c.c}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <span style="font-size:10px;font-weight:600;color:${c.c}">${c.i} ${c.l}</span>
      <span style="font-size:9px;color:var(--tx3)">${label}</span>
    </div>
    ${parentHtml||''}${rows||'<div style="font-size:10px;color:var(--tx3);font-style:italic;margin-bottom:3px">No goals</div>'}
    <div style="display:flex;align-items:center;gap:4px;margin-top:5px">
      <input id="${eid}" type="text" placeholder="+ Add goal, Enter" style="flex:1;font-size:10px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:3px 6px" onkeydown="if(event.key==='Enter'&&this.value.trim()){addGIT('${gkey}','${c.id}',this.value.trim());this.value='';event.preventDefault();}"/>
    </div>
    ${gbar}${tbar}
  </div>`;
}
function goalGrid(gkey,label,pkeys,parents){
  return `<div class="gg">${CATS.map(c=>{
    let ph='';
    if(parents&&parents.length){
      ph='<div style="border-bottom:1px solid var(--bd);margin-bottom:6px;padding-bottom:5px">';
      parents.forEach(p=>{const po=getGO(p.key,c.id);if(po.items.length){ph+=`<div style="font-size:9px;color:var(--tx3);font-weight:600;margin-bottom:2px">${p.label}</div>`;po.items.forEach(it=>{ph+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px"><div style="width:9px;height:9px;border-radius:50%;border:1.5px solid ${c.c};background:${it.done?c.c:'transparent'};flex-shrink:0"></div><span style="font-size:9px;color:${it.done?'var(--tx3)':'var(--tx2)'};text-decoration:${it.done?'line-through':'none'}">${it.text.replace(/</g,'&lt;')}</span></div>`;});}});
      ph+='</div>';
    }
    return goalCard(gkey,c,label,pkeys,ph);
  }).join('')}</div>`;
}

function addCat(){
  const i=document.getElementById('nc-icon').value.trim()||'🎯';
  const l=document.getElementById('nc-name').value.trim();
  const c=document.getElementById('nc-color').value;
  if(!l){alert('Enter a name');return;}
  const id=l.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  CATS.push({id,l,i,c});showCatManager();
}
function removeCat(idx){if(!confirm('Remove "'+CATS[idx].l+'"?'))return;CATS.splice(idx,1);showCatManager();}
function saveCatManager(){saveCats();render();alert('Categories saved!');}
function closeCatManager(){render();}
function render(){if(VIEW==='home')renderHome();else if(VIEW==='year')renderYear();else if(VIEW==='month')renderMonth();}

function renderMonth(){
  const snum=VM<6?1:2,qnum=Math.ceil((VM+1)/3);

  const fd=firstMon(VY,VM),days=daysIn(VY,VM);
  const dkey=SEL?dk(VY,VM,SEL):null;
  const dayTasks=dkey?getDT(dkey):[];
  const wrs=weekRanges(VY,VM);
  const todayW=VY===TY&&VM===TM?weekOfDay(TY,TM,TD):null;
  const selW=SEL?weekOfDay(VY,VM,SEL):null;
  const hlW=selW||todayW;

      const addRow=ro?'':`<input type="text" placeholder="+ goal, Enter" style="width:100%;font-size:9px;background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:2px 5px;margin-top:3px;color:var(--tx)" onkeydown="if(event.key==='Enter'&&this.value.trim()){addGIT('${gk}','${c.id}',this.value.trim());this.value='';event.preventDefault();}"/>`;

  wrs.forEach(({w,start,end})=>{

        <div style="display:flex;align-items:center;gap:5px;margin-top:4px"><div style="flex:1;height:3px;background:var(--bd);border-radius:2px"><div style="height:3px;width:${wpct}%;background:${c.c};border-radius:2px"></div></div><span style="font-size:8px;color:var(--tx3)">${wpct}%</span></div>

  // CALENDAR
  h+=`<div class="sl" style="margin-top:6px">CALENDAR</div>

  for(let e=0;e<fd;e++)h+=`<div class="cc emp"></div>`;
  for(let d=1;d<=days;d++){

    const isT=VY===TY&&VM===TM&&d===TD,isSel=SEL===d,hasMiss=dt.some(t=>!t.done&&!t.carried);

      ${dt.length?`<div class="ctc" style="color:${hasMiss?'var(--rd)':'var(--gr)'}">${done}/${dt.length}</div>`:''}
      ${ft?`<div class="ctm">⏰${ft}</div>`:''}
      <div class="dots">${dots}</div>
    </div>`;
  }
  const rem=(fd+days)%7?7-(fd+days)%7:0;for(let e=0;e<rem;e++)h+=`<div class="cc emp"></div>`;
  h+=`</div></div>`;

  // DAY PANEL
  if(SEL){
    h+=`<div class="dp"><div class="dpt">
      <span>${MF[VM]} ${SEL}${selW?' — W'+selW.w:''}</span>
      <button class="xb" onclick="openGcal()">📅 Google Cal</button>
    </div>`;
    if(!dayTasks.length)h+=`<div style="font-size:12px;color:var(--tx3);font-style:italic;padding:4px 0 8px">No tasks — add below.</div>`;
    dayTasks.forEach(t=>{const cat=CATS.find(c=>c.id===t.cat)||{c:'var(--tx3)'};
      const isEd=EDIT&&EDIT.dkey===dkey&&EDIT.id==t.id;
      if(isEd){
        const cOpts=CATS.map(c=>`<option value="${c.id}"${c.id===t.cat?' selected':''}>${c.i} ${c.l}</option>`).join('');
        h+=`<div class="tr" style="flex-wrap:wrap;gap:5px;align-items:flex-start;padding:8px 0">
          <select id="ecat" class="as" style="font-size:11px">${cOpts}</select>
          <input id="et" class="ai" type="text" value="${t.title.replace(/"/g,'&quot;')}" style="flex:1;min-width:120px"/>
          <input id="eti" class="at" type="time" value="${t.time||''}"/>
          <button onclick="saveEdit('${dkey}','${t.id}')" class="ab" style="padding:4px 10px">✓</button>
          <button onclick="cancelEdit()" class="xb">✕</button>
        </div>`;
      }else{
        h+=`<div class="tr">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${dkey}','${t.id}')"/>
          <span class="tt${t.done?' done':''}">${t.title}</span>
          ${t.time?`<span class="tim">⏰${t.time}</span>`:''}
          ${t.isRec?`<span class="rec">🔁</span>`:''}
          ${t.carried?`<span class="car">carried</span>`:''}
          <div class="tdot" style="background:${cat.c}"></div>
          <button class="td" style="color:var(--bl);font-size:11px" onclick="startEdit('${dkey}','${t.id}')" title="Edit">✎</button>
          <button class="td" onclick="delTask('${dkey}','${t.id}')">✕</button>
        </div>`;
      }
    });
    const opts=CATS.map(c=>`<option value="${c.id}"${NT.cat===c.id?' selected':''}>${c.i} ${c.l}</option>`).join('');
    h+=`<div class="ar">
      <select class="as" onchange="NT.cat=this.value">${opts}</select>
      <input class="ai" type="text" placeholder="Task title…" value="${NT.title}" oninput="NT.title=this.value" onkeydown="if(event.key==='Enter')doAdd()"/>
      <input class="at" type="time" value="${NT.time}" oninput="NT.time=this.value"/>
      <button class="ab" onclick="doAdd()">+ Add</button>
    </div>
    <div class="ar" style="margin-top:4px">
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);cursor:pointer">
        <input type="checkbox" ${NT.recur?'checked':''} onchange="NT.recur=this.checked;document.getElementById('uw').style.display=this.checked?'flex':'none'" style="width:14px;height:14px"/>
        🔁 Recurring daily
      </label>
      <span id="uw" style="display:${NT.recur?'flex':'none'};align-items:center;gap:4px;font-size:11px;color:var(--tx2)">
        Until: <input class="at" type="date" value="${NT.until}" oninput="NT.until=this.value" style="width:120px"/>
      </span>
    </div></div>`;
  }
  h+=`<div class="sl" style="margin-top:8px">MONTH SUMMARY</div>${sumBox(ms,mkeys(VY,VM))}</div>`;
  document.getElementById('R').innerHTML=h;
}
function goHome(){VIEW='home';SEL=null;render();}
function goYear(y){VY=y;VIEW='year';SEL=null;render();}
function goMonth(m){VM=m;VIEW='month';SEL=null;render();}
function selDay(d){SEL=SEL===d?null:d;render();}
function doAdd(){if(!NT.title.trim()||!SEL)return;addTask(dk(VY,VM,SEL),{cat:NT.cat,title:NT.title.trim(),time:NT.time,recur:NT.recur,until:NT.until});NT={cat:NT.cat,title:'',time:'',recur:false,until:''};}
function openGcal(){if(!SEL)return;window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(MF[VM]+' '+SEL)}&dates=${VY}${P(VM+1)}${P(SEL)}/${VY}${P(VM+1)}${P(SEL+1)}&sf=true&output=xml`,'_blank');}
// ─── INIT ────────────────────────────────────────────────────────
if(localStorage.getItem('lft_theme')==='light'){document.body.classList.add('light');document.getElementById('themeBtn').textContent='🌙';}
load();loadCats();render();renderAuthBar();
if(isCfg()){_user=localStorage.getItem('lft_user')||'';loadFromDrive();}
</script>
</body>
